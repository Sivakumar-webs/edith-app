name: Build EDITH APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache libltdl-dev

      - name: Install buildozer and cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug

      - name: Find built APK
        id: find_apk
        run: echo "apk_path=$(find bin -name '*.apk' | head -n 1)" >> $GITHUB_OUTPUT

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: edith-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
